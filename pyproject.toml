[project]
name = "src"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "awscli>=1.40.36",
    "dask>=2025.7.0",
    "dotenv>=0.9.9",
    "folium>=0.20.0",
    "geopandas>=1.1.0",
    "h5py>=3.14.0",
    "mapclassify>=2.9.0",
    "networkx>=3.5",
    "numpy>=2.3.0",
    "pyarrow>=20.0.0",
    "tables>=3.10.2",
    "tabulate>=0.9.0",
    "torch>=2.7.1",
    "torch-geometric>=2.6.1",
    "torch-geometric-temporal>=0.56.1",
    "torch-scatter>=2.1.2",
]

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "coverage>=7.9.1",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "jupytext>=1.17.2",
    "matplotlib>=3.10.3",
    "plotly>=6.1.2",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py", "notebooks/**/*.py"]

[tool.ruff.lint]
select = ["I"]

# [tool.ruff.format]
# quote-style = "double"
# line-ending = "lf"

# [tool.mypy]
# strict = true

[tool.codespell]
# Add a comma-separated list of file patterns to skip
skip = ["./data/*", "*/htmlcov/*"]
