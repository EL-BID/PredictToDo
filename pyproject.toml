[project]
name = "congestion-bogota"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "awscli>=1.40.36",
    "geopandas>=1.1.0",
    "numpy>=2.3.0",
]

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "coverage>=7.9.1",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.3",
    "plotly>=6.1.2",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "seaborn>=0.13.2",
]

[tool.ruff]
include = ["lio/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["I"]

# [tool.ruff.format]
# quote-style = "double"
# line-ending = "lf"

# [tool.mypy]
# strict = true

[tool.codespell]
# Add a comma-separated list of file patterns to skip
skip = "./data/*"